name: Vocabulary content

on:
  pull_request:
    paths:
      - 'content/vocabulary/**'
      - 'scripts/vocabulary/**'
      - 'apps/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/vocabulary-content.yml'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  vocabulary-content:
    name: vocabulary-content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install workspace dependencies
        run: npm ci

      - name: Validate vocabulary source baseline
        run: npm run vocab:validate-content
      - name: Build and validate canonical learner catalog
        run: |
          catalog_dir="$RUNNER_TEMP/ielts-cozy-vocabulary-catalog"
          npm run vocab:normalize-content -- --out-dir "$catalog_dir" --apply
          node scripts/vocabulary/validate-content.mjs --canonical-dir "$catalog_dir"
      - name: Typecheck web app
        run: npm run typecheck --workspace apps/web

      - name: Build web app
        run: npm run build --workspace apps/web

      - name: Run all tests
        run: npm test
